name: Release

# Every push to main is tested, built for every platform and published as a
# release, so the website's download buttons always fetch the latest build.
# Asset names carry no version, which keeps
# https://github.com/bob9/dd-pits/releases/latest/download/<asset> stable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # dd-pits.app (Apple Silicon + Intel) needs a Mac to bundle, sign and put
  # on a disk image.
  macapp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dd-pits.app
        run: packaging/macos/build-app.sh "v0.1.${{ github.run_number }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macapp
          path: dist/dd-pits-macos.dmg

  release:
    needs: macapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Version
        id: ver
        run: echo "version=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build every platform
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64 linux/arm; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            # linux/arm is 32-bit Raspberry Pi OS; ARMv6 runs on every Pi.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=6 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT" \
              -o "dist/dd-pits-$os-$arch$ext" ./cmd/dd-pits
          done

      - uses: actions/download-artifact@v4
        with:
          name: macapp
          path: dist

      - name: Checksums
        run: cd dist && sha256sum dd-pits-* > SHA256SUMS.txt

      - name: Package the RotorHazard plugin
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p build && cp -r rotorhazard/dd_pits build/dd_pits
          find build -name __pycache__ -prune -exec rm -rf {} +
          # The plugin's version follows the release, so RotorHazard shows which one it has.
          python3 - "$VERSION" <<'PY'
          import json, sys
          p = "build/dd_pits/manifest.json"
          m = json.load(open(p))
          m["version"] = sys.argv[1].lstrip("v")
          json.dump(m, open(p, "w"), indent=4)
          PY
          (cd build && zip -qr ../dist/dd-pits-rotorhazard-plugin.zip dd_pits)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: dd-pits ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
          body: |
            Download dd-pits for your computer and open it. It opens your browser on its Status page:
            whether the timer and goggle backpack are connected, the race on now, and its live log.
            Its log is also saved to `dd-pits.log` beside its settings.

            | Computer | File |
            | --- | --- |
            | **Mac** (Apple Silicon or Intel) | `dd-pits-macos.dmg`: open it and drag **dd-pits** to Applications |
            | Mac with Apple Silicon, command line | `dd-pits-darwin-arm64` |
            | Mac with Intel, command line | `dd-pits-darwin-amd64` |
            | Windows | `dd-pits-windows-amd64.exe` |
            | Linux (PC) | `dd-pits-linux-amd64` |
            | Linux (Raspberry Pi, 64-bit OS) | `dd-pits-linux-arm64` |
            | Linux (Raspberry Pi, 32-bit OS) | `dd-pits-linux-arm` |
            | **RotorHazard timer** | `dd-pits-rotorhazard-plugin.zip`: upload it in RotorHazard under Settings → Plugins. It downloads and runs dd-pits for you. |

            **Mac:** open `dd-pits-macos.dmg`, drag **dd-pits** onto **Applications**, then open it from Applications. The first time, macOS says it can't check the app: open **System Settings → Privacy & Security** and choose **Open Anyway**. It runs in the background (no Dock icon); open it again to bring back the Status page, and quit from there. Settings and log: `~/Library/Application Support/dd-pits/`.
            **Windows:** if SmartScreen warns, choose More info → Run anyway.

            Try it first in the [live demo](https://demo.dd-pits.threedigitalllamas.com.au). Made by [bob9](https://github.com/bob9) · [Buy me a coffee](https://buymeacoffee.com/bobnine) ☕
