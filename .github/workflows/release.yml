name: Release

# Every push to main is tested, built for every platform and published as a
# release, so the website's download buttons always fetch the latest build.
# Asset names carry no version, which keeps
# https://github.com/bob9/dd-pits/releases/latest/download/<asset> stable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Version
        id: ver
        run: echo "version=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build every platform
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT" \
              -o "dist/dd-pits-$os-$arch$ext" ./cmd/dd-pits
          done
          cd dist && sha256sum dd-pits-* > SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: dd-pits ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
          body: |
            Download the binary for your computer, put it next to FPVTrackside and run it.
            The setup guide opens in your browser.

            | Computer | File |
            | --- | --- |
            | Mac with Apple Silicon (M1 or later) | `dd-pits-darwin-arm64` |
            | Mac with Intel | `dd-pits-darwin-amd64` |
            | Windows | `dd-pits-windows-amd64.exe` |
            | Linux (PC) | `dd-pits-linux-amd64` |
            | Linux (Raspberry Pi 4/5, ARM) | `dd-pits-linux-arm64` |

            **Mac:** in Terminal, run `chmod +x dd-pits-darwin-*` and `xattr -d com.apple.quarantine dd-pits-darwin-*` once, then `./dd-pits-darwin-arm64`.
            **Windows:** if SmartScreen warns, choose More info → Run anyway.

            Try it first in the [live demo](https://demo.dd-pits.threedigitalllamas.com.au). Made by [bob9](https://github.com/bob9) · [Buy me a coffee](https://buymeacoffee.com/bobnine) ☕
